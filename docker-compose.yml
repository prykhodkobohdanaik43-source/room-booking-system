services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: room_booking
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U booking -d room_booking']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://booking:booking@db:5432/room_booking
      CORPORATE_EMAIL_DOMAIN: example.com
      JWT_SECRET: ${JWT_SECRET:-change-me}
      PORT: 3000
    ports:
      - '3000:3000'

volumes:
  db-data:
