name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: room_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d room_booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://booking:booking@localhost:5432/room_booking_test
      - run: npm run build
